metadata:
  name: mtaBuild
  description: Performs an mta build
  errors:
    - pattern: "cannot find symbol"
      message: "Java compilation failed due to missing symbol. Check imports and dependencies."
      category: "compilation"
    - pattern: "has been compiled by a more recent version of the Java Runtime.*class file version"
      message: "Java version incompatibility. Update Java runtime or use compatible dependency versions."
      category: "version"
  longDescription: |
    Executes the SAP Multitarget Application Archive Builder to create an mtar archive of the application.

    ### Build-quality profile strategy

    mtaBuild drives Maven internally via the `mbt` binary, so Maven profiles cannot be passed on
    the command line.  Instead they are communicated by rewriting the `<activeProfiles>` section
    of the downloaded global settings.xml before `mbt build` is invoked.

    This rewrite is performed only when `globalSettingsFile` is provided — it is a no-op when no
    global settings file is configured (the Docker image's default Maven settings are left unchanged).

    Active-profile rules (positive IDs only; `!profile` is a CLI-only syntax):

    * **Default / Release quality** (no user profiles): `<activeProfile>release.build</activeProfile>`
      — replaces the SAP Artifactory default (`snapshot.build`) so that only the build-releases
      repository is reachable.
    * **Milestone quality** (when `milestone.build` is present in `profiles`): user profiles are
      written as-is; `milestone.build` activates its own repository mapping.
    * **Snapshot opt-in** (when `snapshot.build` is present in `profiles`): user profiles are
      written as-is.
    * **Custom profiles** (any other non-empty list): `release.build` is prepended to the user
      list so the release repository remains accessible.

    **Jenkins orchestrator**: Groovy wrappers (`executeBuild` / `sapPiperStageCentralBuild`)
    communicate the desired build quality by passing `['milestone.build']` for Milestone builds
    and an empty list for Release builds.

    **GHA and Azure orchestrators**: There is no Groovy wrapper and no `buildQuality` mapping
    for these orchestrators.  `mtaBuild` always uses the default Release profile set.
    Milestone builds are **not supported** on GHA/Azure.

    **Profile guard effectiveness**: Guard profiles are Maven no-ops unless the
    `globalSettingsFile` settings.xml defines the `snapshot.build`, `milestone.build`, and
    `release.build` profiles.  The SAP Artifactory release settings.xml used by all supported
    deviation files (Jenkins, GHA, Azure) defines all three, so the guards are effective on all
    orchestrators.

    ### build with dependencies from a private repository

    1. For Maven related settings refer [Maven build dependencies](./mavenBuild.md#build-with-dependencies-from-a-private-repository)
    2. For NPM related settings refer [NPM build dependencies](./npmExecuteScripts.md#build-with-private-dependencies-from-a-repository)
spec:
  inputs:
    params:
      - name: mtarName
        type: string
        description: "The name of the generated mtar file including its extension."
        scope:
          - PARAMETERS
          - STAGES
          - STEPS
        mandatory: false
        default:
      - name: mtarGroup
        type: string
        description: "The group to which the mtar artifact will be uploaded. Required when publish is True."
        scope:
          - PARAMETERS
          - STAGES
          - STEPS
        mandatory: false
        default:
      - name: version
        aliases:
          - name: artifactVersion
        type: string
        description: Version of the mtar artifact
        scope:
          - PARAMETERS
          - STAGES
          - STEPS
        resourceRef:
          - name: commonPipelineEnvironment
            param: artifactVersion
      - name: extensions
        type: string
        description: "The path to the extension descriptor file."
        scope:
          - PARAMETERS
          - STAGES
          - STEPS
        mandatory: false
        default:
        aliases:
          - name: extension
      - name: jobs
        type: int
        description: "Configures the number of Make jobs that can run simultaneously. Maximum value allowed is 8"
        scope:
          - PARAMETERS
          - STAGES
          - STEPS
        mandatory: false
        default:
        aliases:
          - name: jobs
      - name: platform
        type: string
        description: "The target platform to which the mtar can be deployed."
        scope:
          - PARAMETERS
          - STAGES
          - STEPS
        mandatory: false
        default: CF
        possibleValues:
          - CF
          - NEO
          - XSA
      - name: applicationName
        type: string
        description: "The name of the application which is being built. If the parameter has been provided and no `mta.yaml` exists, the `mta.yaml` will be automatically generated using this parameter and the information (`name` and `version`) from 'package.json` before the actual build starts."
        scope:
          - PARAMETERS
          - STAGES
          - STEPS
        mandatory: false
        default:
      - name: source
        type: string
        description: "The path to the MTA project."
        scope:
          - PARAMETERS
          - STAGES
          - STEPS
        mandatory: false
        default: "./"
      - name: target
        type: string
        description: "The folder for the generated `MTAR` file. If the parameter has been provided, the `MTAR` file is saved in the root of the folder provided by the argument."
        scope:
          - PARAMETERS
          - STAGES
          - STEPS
        mandatory: false
        default: "./"
      - name: defaultNpmRegistry
        type: string
        description: "Url to the npm registry that should be used for installing npm dependencies."
        scope:
          - GENERAL
          - PARAMETERS
          - STAGES
          - STEPS
        mandatory: false
        aliases:
          - name: npm/defaultNpmRegistry
        default:
      - name: projectSettingsFile
        type: string
        description: "Path or url to the mvn settings file that should be used as project settings file."
        scope:
          - GENERAL
          - PARAMETERS
          - STAGES
          - STEPS
        mandatory: false
        aliases:
          - name: maven/projectSettingsFile
      - name: globalSettingsFile
        type: string
        description: "Path or url to the mvn settings file that should be used as global settings file"
        scope:
          - GENERAL
          - PARAMETERS
          - STAGES
          - STEPS
        mandatory: false
        aliases:
          - name: maven/globalSettingsFile
      - name: m2Path
        type: string
        description: Path to the location of the local repository that should be used.
        scope:
          - GENERAL
          - STEPS
          - STAGES
          - PARAMETERS
        mandatory: false
        aliases:
          - name: maven/m2Path
      - name: installArtifacts
        type: bool
        description: "If enabled, for npm packages this step will install all dependencies including dev dependencies. For maven it will install all artifacts to the local maven repository. Note: This happens _after_ mta build was done. The default mta build tool does not install dev-dependencies as part of the process. If you require dev-dependencies for building the mta, you will need to use a [custom builder](https://sap.github.io/cloud-mta-build-tool/configuration/#configuring-the-custom-builder)"
        scope:
          - GENERAL
          - STEPS
          - STAGES
          - PARAMETERS
      - name: mtaDeploymentRepositoryPassword
        type: string
        description: Password for the alternative deployment repository to which mtar artifacts will be publised
        scope:
          - GENERAL
          - PARAMETERS
          - STAGES
          - STEPS
        secret: true
        resourceRef:
          - name: commonPipelineEnvironment
            param: custom/mavenRepositoryPassword
          - name: commonPipelineEnvironment
            param: custom/repositoryPassword
          - type: vaultSecretFile
            name: mtaDeploymentRepositoryPasswordFileVaultSecretName
            default: mta-deployment-repository-password
      - name: mtaDeploymentRepositoryUser
        type: string
        description: User for the alternative deployment repository to which which mtar artifacts will be publised
        scope:
          - GENERAL
          - PARAMETERS
          - STAGES
          - STEPS
        resourceRef:
          - name: commonPipelineEnvironment
            param: custom/mavenRepositoryUsername
          - name: commonPipelineEnvironment
            param: custom/repositoryUsername
      - name: mtaDeploymentRepositoryUrl
        type: string
        description: Url for the alternative deployment repository to which mtar artifacts will be publised
        scope:
          - GENERAL
          - PARAMETERS
          - STAGES
          - STEPS
        resourceRef:
          - name: commonPipelineEnvironment
            param: custom/mavenRepositoryURL
          - name: commonPipelineEnvironment
            param: custom/repositoryUrl
      - name: publish
        type: bool
        description: pushed mtar artifact to altDeploymentRepositoryUrl/altDeploymentRepositoryID when set to true
        scope:
          - STEPS
          - STAGES
          - PARAMETERS
        default: false
        aliases:
          - name: mta/publish
      - name: profiles
        type: "[]string"
        description: >
          Defines list of Maven build profiles to be used.
          When globalSettingsFile is set the step rewrites the settings.xml <activeProfiles>
          section with the effective profile set before invoking mbt build.
          By default (Release quality, no user profiles) the active profile is set to
          'release.build' — replacing the SAP Artifactory default (snapshot.build) and
          restricting resolution to the build-releases repository only.
          When 'milestone.build' is present the user profiles are written as-is (milestone
          repository mapping is driven by the milestone.build profile itself).
          When 'snapshot.build' is present the user profiles are written as-is.
          On GHA and Azure orchestrators only Release quality is supported; Milestone builds are
          not available on those platforms.
        scope:
          - PARAMETERS
          - GENERAL
          - STAGES
          - STEPS
      - name: buildSettingsInfo
        type: string
        description: build settings info is typically filled by the step automatically to create information about the build settings that were used during the mta build . This information is typically used for compliance related processes.
        scope:
          - STEPS
          - STAGES
          - PARAMETERS
        resourceRef:
          - name: commonPipelineEnvironment
            param: custom/buildSettingsInfo
      - name: createBOM
        type: bool
        description: Creates the bill of materials (BOM) using CycloneDX plugin.
        scope:
          - GENERAL
          - STEPS
          - STAGES
          - PARAMETERS
        default: false
      - name: enableSetTimestamp
        type: bool
        description: Enables setting the timestamp in the `mta.yaml` when it contains `${timestamp}`. Disable this when you want the MTA Deploy Service to do this instead.
        scope:
          - STEPS
          - STAGES
          - PARAMETERS
        default: true
      - name: createBuildArtifactsMetadata
        type: bool
        default: true
        description: metadata about the artifacts that are built and published, this metadata is generally used by steps downstream in the pipeline
        scope:
          - STEPS
          - STAGES
          - PARAMETERS
  outputs:
    resources:
      - name: commonPipelineEnvironment
        type: piperEnvironment
        params:
          - name: mtarFilePath
          - name: custom/mtaBuildToolDesc
          - name: custom/mtarPublishedUrl
          - name: custom/buildSettingsInfo
          - name: custom/mtaBuildArtifacts
      - name: reports
        type: reports
        params:
          - filePattern: "**/TEST-*.xml"
            type: junit
          - filePattern: "**/cobertura-coverage.xml"
            type: cobertura-coverage
          - filePattern: "**/jacoco.xml"
            type: jacoco-coverage
  containers:
    - image: devxci/mbtci-java21-node22:1.2.34
