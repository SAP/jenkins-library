metadata:
  name: gcpPublishEvent
  description: Publishes an event to GCP using OIDC authentication (beta)
  longDescription: |
    This step is in beta.
    Authentication to GCP is handled by an OIDC token received from, for example, Vault.
spec:
  inputs:
    params:
      - name: vaultNamespace
        type: "string"
        description:
        scope:
          - GENERAL
          - PARAMETERS
          - STAGES
          - STEPS
      - name: vaultServerUrl
        type: "string"
        description:
        scope:
          - GENERAL
          - PARAMETERS
          - STAGES
          - STEPS
      - name: OIDCToken
        description:
        type: "string"
        scope:
          - PARAMETERS
          - STAGES
          - STEPS
      - name: gcpProjectNumber
        description:
        type: "string"
        scope:
          - GENERAL
          - PARAMETERS
          - STAGES
          - STEPS
      - name: gcpWorkloadIdentityPool
        description: A workload identity pool is an entity that lets you manage external identities.
        type: "string"
        scope:
          - GENERAL
          - PARAMETERS
          - STAGES
          - STEPS
      - name: gcpWorkloadIdentityPoolProvider
        description: A workload identity pool provider is an entity that describes a relationship between Google Cloud and your IdP.
        type: "string"
        scope:
          - GENERAL
          - PARAMETERS
          - STAGES
          - STEPS
      - name: topic
        description: The pubsub topic to which the message is published.
        type: "string"
        scope:
          - GENERAL
          - PARAMETERS
          - STAGES
          - STEPS
      - name: eventSource
        description: The event producer URI as defined by the CDEvents spec (e.g. '/default/org.myteam.piper').
        type: "string"
        scope:
          - GENERAL
          - PARAMETERS
          - STAGES
          - STEPS
      - name: eventType
        description: The CDEvents custom type string for this event (e.g. "dev.cdeventsx.piper-pipeline.runstarted.0.1.0"). Must match the CDEvents custom type format dev.cdeventsx.<tool>-<subject>.<predicate>.<version>.
        type: "string"
        scope:
          - PARAMETERS
      - name: eventData
        type: string
        description: JSON string set as the event's customData. Merged with additionalEventData if both are provided.
        resourceRef:
          - name: commonPipelineEnvironment
            param: custom/eventData
      - name: additionalEventData
        description: JSON string merged on top of eventData. Values here overwrite matching keys in eventData. Must be passed as a direct parameter.
        type: string
        scope:
          - PARAMETERS
